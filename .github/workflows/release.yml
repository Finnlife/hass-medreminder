name: Release

# HACS offers whatever the newest GitHub release points at, so cutting a
# release is the step that actually ships an update to installations. This
# workflow does it from the version in the integration manifest: bump the
# manifest, describe the change in CHANGELOG.md, push to main, and the
# matching tag and release appear. Without a changelog section the release
# is refused, so no version goes out undescribed.

on:
  push:
    branches: [main]
    paths:
      - custom_components/medication_reminder/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish the manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # The release is created through gh with its own token, so nothing
          # later in the job needs git credentials left in the workspace.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Read the version from the manifest
        id: version
        run: |
          version=$(python -c "import json; print(json.load(open('custom_components/medication_reminder/manifest.json'))['version'])")
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Manifest version '$version' is not MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Later steps read it from the environment rather than having it
          # expanded into their scripts.
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Manifest version: $version"

      - name: Check whether this version was already released
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${VERSION} already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Take the release notes from the changelog
        if: steps.existing.outputs.exists == 'false'
        run: |
          python scripts/changelog-section.py "${VERSION}" \
            --output release-notes.md
          cat release-notes.md

      - name: Make sure the frontend cache key matches the manifest
        if: steps.existing.outputs.exists == 'false'
        run: |
          python -c "
          import json, pathlib, re, sys
          root = pathlib.Path('custom_components/medication_reminder')
          version = json.loads((root / 'manifest.json').read_text())['version']
          match = re.search(r'FRONTEND_CACHE_KEY: Final = \"([^\"]+)\"', (root / 'const.py').read_text())
          if match is None:
              sys.exit('FRONTEND_CACHE_KEY not found in const.py')
          if match.group(1) != version:
              sys.exit(f'FRONTEND_CACHE_KEY {match.group(1)} does not match manifest version {version}; browsers would keep serving the cached panel and card')
          print('Frontend cache key matches', version)
          "

      - name: Install the integration requirements
        if: steps.existing.outputs.exists == 'false'
        run: |
          requirements=$(python -c "import json; print(' '.join(json.load(open('custom_components/medication_reminder/manifest.json'))['requirements']))")
          echo "Installing: $requirements"
          pip install $requirements

      - name: Run the checks before publishing
        if: steps.existing.outputs.exists == 'false'
        run: |
          python -m unittest discover -s tests
          python -m compileall -q custom_components/medication_reminder tests
          for file in custom_components/medication_reminder/frontend/*.js; do
            node --check "$file"
          done

      - name: Validate the Home Assistant manifest
        if: steps.existing.outputs.exists == 'false'
        uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c # master

      - name: Build a zip for manual installation
        if: steps.existing.outputs.exists == 'false'
        run: |
          cd custom_components
          zip -r "$GITHUB_WORKSPACE/medication_reminder.zip" medication_reminder

      - name: Create the tag and the release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          previous=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' || true)
          if [ -n "$previous" ]; then
            {
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${VERSION}"
            } >> release-notes.md
          fi
          gh release create "${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "${VERSION}" \
            --notes-file release-notes.md \
            medication_reminder.zip

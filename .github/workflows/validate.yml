name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Home Assistant and HACS move on their own; a weekly run catches drift
    # in their interfaces before it reaches an installation.
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run the unit tests
        run: python -m unittest discover -s tests -v

      - name: Byte-compile every module
        run: python -m compileall custom_components/medication_reminder tests

      - name: Check the frontend syntax
        run: |
          for file in custom_components/medication_reminder/frontend/*.js; do
            node --check "$file"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.12.12

      - name: Check formatting rules
        run: ruff check custom_components tests

  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The brands check only applies to integrations that want to be part
          # of the HACS default list, which needs a pull request against
          # home-assistant/brands.
          ignore: brands

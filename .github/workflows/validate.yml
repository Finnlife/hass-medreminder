name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Home Assistant and HACS move on their own; a weekly run catches drift
    # in their interfaces before it reaches an installation.
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install the integration requirements
        run: |
          requirements=$(python -c "import json; print(' '.join(json.load(open('custom_components/medication_reminder/manifest.json'))['requirements']))")
          echo "Installing: $requirements"
          pip install $requirements

      - name: Run the unit tests
        run: python -m unittest discover -s tests -v

      - name: Byte-compile every module
        run: python -m compileall custom_components/medication_reminder tests

      - name: Check the frontend syntax
        run: |
          for file in custom_components/medication_reminder/frontend/*.js; do
            node --check "$file"
          done

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.12.12

      - name: Check the code style
        run: ruff check custom_components tests

  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: home-assistant/actions/hassfest@07f46fd2e19967768b5fd3000f91f857452b767c # master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

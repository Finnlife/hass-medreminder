name: Release

# HACS offers whatever the newest GitHub release points at, so cutting a
# release is the step that actually ships an update to installations. This
# workflow does it from the version in the integration manifest: bump the
# manifest, push to main, and the matching tag and release appear.

on:
  push:
    branches: [main]
    paths:
      - custom_components/medication_reminder/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish the manifest version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Read the version from the manifest
        id: version
        run: |
          version=$(python -c "import json; print(json.load(open('custom_components/medication_reminder/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $version"

      - name: Check whether this version was already released
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.version.outputs.version }} already exists, nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Make sure the frontend cache key matches the manifest
        if: steps.existing.outputs.exists == 'false'
        run: |
          python -c "
          import json, pathlib, re, sys
          root = pathlib.Path('custom_components/medication_reminder')
          version = json.loads((root / 'manifest.json').read_text())['version']
          match = re.search(r'FRONTEND_CACHE_KEY: Final = \"([^\"]+)\"', (root / 'const.py').read_text())
          if match is None:
              sys.exit('FRONTEND_CACHE_KEY not found in const.py')
          if match.group(1) != version:
              sys.exit(f'FRONTEND_CACHE_KEY {match.group(1)} does not match manifest version {version}; browsers would keep serving the cached panel and card')
          print('Frontend cache key matches', version)
          "

      - name: Install the integration requirements
        if: steps.existing.outputs.exists == 'false'
        run: |
          requirements=$(python -c "import json; print(' '.join(json.load(open('custom_components/medication_reminder/manifest.json'))['requirements']))")
          echo "Installing: $requirements"
          pip install $requirements

      - name: Run the checks before publishing
        if: steps.existing.outputs.exists == 'false'
        run: |
          python -m unittest discover -s tests
          python -m compileall -q custom_components/medication_reminder tests
          for file in custom_components/medication_reminder/frontend/*.js; do
            node --check "$file"
          done

      - name: Validate the Home Assistant manifest
        if: steps.existing.outputs.exists == 'false'
        uses: home-assistant/actions/hassfest@master

      - name: Build a zip for manual installation
        if: steps.existing.outputs.exists == 'false'
        run: |
          cd custom_components
          zip -r "$GITHUB_WORKSPACE/medication_reminder.zip" medication_reminder

      - name: Create the tag and the release
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes \
            medication_reminder.zip

record_intake:
  fields:
    occurrence_id:
      required: true
      selector:
        text:
    doses:
      selector:
        object:
snooze:
  fields:
    occurrence_id:
      required: true
      selector:
        text:
    minutes:
      required: true
      default: 30
      selector:
        number:
          min: 1
          max: 10080
          mode: box
adjust_stock:
  fields:
    medication_id:
      required: true
      selector:
        text:
    delta:
      required: true
      selector:
        number:
          mode: box
add_package:
  fields:
    medication_id:
      required: true
      selector:
        text:
    quantity:
      required: true
      selector:
        number:
          min: 0.001
          mode: box
    nickname:
      selector:
        text:
    lot_number:
      selector:
        text:
    expires_on:
      selector:
        date:
    external_code:
      selector:
        text:
record_unplanned_intake:
  fields:
    items:
      required: true
      selector:
        object:
postpone_interval:
  fields:
    occurrence_id:
      required: true
      selector:
        text:
